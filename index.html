<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090b" />
    <meta
      name="description"
      content="Logic Play — the underdog builder's club at SRM. Ship real projects, form hackathon teams, get mentored by people who've actually done it."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Logic Play" />
    <meta property="og:title" content="Logic Play — Stop consuming technology, start building it." />
    <meta
      property="og:description"
      content="Logic Play — the underdog builder's club at SRM. Ship real projects, form hackathon teams, get mentored by people who've actually done it."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Logic Play — Stop consuming technology, start building it." />
    <meta
      name="twitter:description"
      content="The underdog builder's club at SRM. Ship real projects, form hackathon teams, get mentored."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Logic Play",
        "description": "A student technical club at SRM where members ship real projects, form hackathon teams, and get mentored.",
        "url": "%VITE_SITE_URL%/"
      }
    </script>
    <script>
      // Set the theme attribute before first paint so there's no flash of
      // the wrong theme. useTheme.ts reads this same attribute on init and
      // takes over from here.
      (function () {
        var stored = localStorage.getItem("logicplay-theme");
        var theme =
          stored ||
          (window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link
      rel="preload"
      href="/src/fonts/GeistMono[wght].woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Logic Play — Stop consuming technology, start building it.</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
